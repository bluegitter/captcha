<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>验证码识别测试</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .card { border: 1px solid #8885; border-radius: 12px; padding: 20px; margin: 16px 0; }
    button, select, input { font: inherit; padding: 8px 12px; margin: 4px 4px 4px 0; }
    #drop { border: 2px dashed #888; border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; }
    #drop.drag { border-color: #1683ff; background: #1683ff18; }
    #preview { image-rendering: pixelated; width: 360px; height: 114px; object-fit: contain; background: white; display: block; margin-top: 12px; }
    #result { font-size: 1.6rem; letter-spacing: .15em; }
    .muted { opacity: .75; }
    .error { color: #d33; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>验证码识别测试</h1>
  <p class="muted">输入会被缩放为 120×38 灰度图，并由 ONNX Runtime Web 在浏览器本地推理。</p>
  <div class="card">
    <label>模型：</label>
    <select id="model">
      <option value="/models/captcha_crnn_int8.onnx">动态 INT8（WASM）</option>
      <option value="/models/captcha_crnn_fp16.onnx">FP16（WebGPU）</option>
      <option value="/models/captcha_crnn_fp32.onnx">FP32（WASM）</option>
    </select>
    <button id="load">加载模型</button>
    <span id="status" class="muted">未加载</span>
  </div>
  <div class="card">
    <div id="drop">点击或拖入验证码图片<input id="file" type="file" accept="image/*" hidden></div>
    <img id="preview" alt="验证码预览" hidden>
    <button id="predict" disabled>识别</button>
    <div id="result"></div>
    <div id="meta" class="muted"></div>
    <div id="error" class="error"></div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
